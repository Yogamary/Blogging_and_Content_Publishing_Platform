<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>BlogSphere | My Bookmarks</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>


<body class="bookmarks-page">


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo-area">

            <div class="logo-icon">
                ✎
            </div>

            <div class="logo-text">

                <h2>
                    Blog<span>Sphere</span>
                </h2>

                <p>
                    Share · Inspire · Grow
                </p>

            </div>

        </div>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="explore.html">
                Explore
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="about.html">
                About Us
            </a>

        </nav>


        <div class="nav-actions">

            <button class="search-btn">
                
            </button>

            <a
                href="login.html"
                class="login-btn">

                Login

            </a>

            <a
                href="register.html"
                class="register-btn">

                Register

            </a>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="bookmarks-main">


        <section class="bookmarks-header">

            <span class="heading-line"></span>

            <h1>
                My Bookmarks
            </h1>

            <p>
                Blogs you've saved for later.
            </p>

        </section>


        <!-- ================= BOOKMARKS ================= -->

        <section class="bookmarks-section">

            <div
                id="bookmarksList"
                class="bookmarks-grid">

                <p class="no-bookmarks">
                    Loading bookmarks...
                </p>

            </div>

        </section>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">

            <h2>
                Blog<span>Sphere</span>
            </h2>

            <p>
                Share your story. Inspire the world.
            </p>

        </div>

        <p class="copyright">
            © 2026 BlogSphere. All rights reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
