<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSphere | My Blogs</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="my-blogs-page">

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo-area">
            <div class="logo-icon">✎</div>

            <div class="logo-text">
                <h2>Blog<span>Sphere</span></h2>
                <p>Share · Inspire · Grow</p>
            </div>
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="categories.html">Categories</a>
            <a href="about.html">About Us</a>
        </nav>

        <div class="nav-actions" id="navActions">
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="register-btn">Register</a>
        </div>

    </header>

    <!-- MAIN CONTENT -->
    <main class="my-blogs-main">

        <section class="my-blogs-header">

            <span class="heading-line"></span>

            <h1>My Blogs</h1>

            <p>Manage all the blogs you have created in one place.</p>

            <div class="my-blogs-summary">
                <div class="my-blogs-count-card">
                    <span>Total Posts</span>
                    <strong id="myBlogsCount">—</strong>
                </div>

                <a href="create-post.html" class="create-blog-btn">
                    + Create New Blog
                </a>
            </div>

        </section>

        <!-- BLOG LIST -->
        <section class="my-blogs-content">

            <div id="myBlogsList" class="my-blogs-grid">

                <p class="no-my-blogs">
                    Loading your blogs...
                </p>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">
            <h2>Blog<span>Sphere</span></h2>
            <p>Share your story. Inspire the world.</p>
        </div>

        <p class="copyright">
            © 2026 BlogSphere. All rights reserved.
        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
