<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSphere | Edit Blog</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo-area">

            <div class="logo-icon">
                ✎
            </div>

            <div class="logo-text">

                <h2>
                    Blog<span>Sphere</span>
                </h2>

                <p>
                    Share · Inspire · Grow
                </p>

            </div>

        </div>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="explore.html">
                Explore
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="about.html">
                About Us
            </a>

        </nav>


    </header>



    <!-- ================= EDIT BLOG ================= -->

    <main class="edit-blog-page">


        <section class="edit-blog-container">


            <!-- ================= HEADER ================= -->

            <div class="edit-blog-header">

                <p class="hero-small">
                    EDIT YOUR STORY
                </p>

                <h1>
                    Edit <span>Blog</span>
                </h1>

                <p>
                    Update your blog and save your changes.
                </p>

            </div>



            <!-- ================= BLOG TITLE ================= -->

            <div class="edit-form-group">

                <label for="postTitle">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="postTitle"
                    placeholder="Enter your blog title"
                >

            </div>



            <!-- ================= CATEGORY ================= -->

            <div class="edit-form-group">

                <label for="postCategory">
                    Category
                </label>

                <select id="postCategory">

                    <option value="">
                        Select Category
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Programming">
                        Programming
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Lifestyle">
                        Lifestyle
                    </option>

                </select>

            </div>



            <!-- ================= CONTENT ================= -->

            <div class="edit-form-group">

                <label for="postContent">
                    Content
                </label>

                <textarea
                    id="postContent"
                    rows="12"
                    placeholder="Write your blog content here..."
                ></textarea>

            </div>



            <!-- ================= IMAGE URL ================= -->
          <!-- ================= BLOG IMAGE ================= -->

<div class="edit-form-group">

    <label for="coverImage">
        Blog Image
    </label>

    <input
        type="file"
        id="coverImage"
        accept="image/*"
        onchange="previewCoverImage(event)"
    >

    <img
        id="coverPreview"
        style="display:none; width:100%; max-height:300px; object-fit:cover; margin-top:15px; border-radius:15px;"
        alt="Blog image preview"
    >

</div>  
         



            <!-- ================= STATUS ================= -->

            <p id="editStatus"></p>



            <!-- ================= BUTTONS ================= -->

            <div class="edit-form-actions">

                <button
                    type="button"
                    onclick="updateBlog()">
                    Save Changes
                </button>


                <button
                    type="button"
                    onclick="window.location.href='explore.html'">
                    Cancel
                </button>

            </div>


        </section>


    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>


</body>

</html>
